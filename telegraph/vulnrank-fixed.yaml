# VulnRank - Telegraph miner manifest (YAML Miner Standard, version "1").
# Replace base_url with the deployed HTTPS URL before registering. A YAML is public and pinned
# on-chain: it contains no secrets (this miner needs no API key from callers).
# Validate at https://anjoman.ai/dashboard/earn BEFORE registering (registration cannot be edited).
version: "1"
kind: miner
id: 7310099
slug: vulnrank-triage
protocol: generic
name: VulnRank - Security, Compliance and Verified Lookups
description: >-
  Thirty-one intents. Deterministic and sourced, no language model: a source that is unavailable is reported as unavailable, never as a
  negative result. Security: CVE triage (NVD CVSS v3.1 score with CISA KEV, FIRST EPSS, asset-aware priority), pre-launch security review
  of code, packages, a public GitHub repository or website with a cited legal checklist, and static audit of Solidity source. Legal and
  compliance: sanctions screening (OFAC SDN and UN consolidated lists), legal-entity register records (GLEIF), vendor verification (EU VAT
  via VIES, GLEIF, sanctions), SEC EDGAR filing monitoring, contract obligation and deadline extraction, content moderation, plagiarism
  overlap against a supplied source, email authentication (SPF, DKIM, DMARC) and rule-based payment transaction risk. Language: sentiment
  (VADER), translation (MyMemory; the text is sent to that service), text classification, keyword and entity extraction, extractive
  summarisation, semantic similarity, AI-text detection and model-output evaluation (all rule-based). Blockchain and DeFi: USD crypto
  price (Coinbase, Kraken), gas price, transaction status, wallet balance and token total supply on Ethereum, Base, Arbitrum, Polygon and
  Optimism (two public RPC operators that must agree), and TVL, APY and pool liquidity (DefiLlama). Also current city temperature
  (Open-Meteo) and DNS record presence (Google Public DNS, Cloudflare). Screening, scoring and compliance output is evidence for human
  review, not legal or financial advice.
base_url: https://vulnrank.onrender.com

endpoints:
  - path: /vuln-triage
    external_path: /vuln-triage
    method: GET
    description: >-
      Triage one or more already-detected CVEs. Returns cvss_base_score (NVD primary CVSS v3.1, 0-10) of the
      highest-priority CVE plus a ranked list of all supplied CVEs with CISA KEV, EPSS, risk score, priority,
      reasons and recommended action. Optional asset context (criticality, internet exposure, environment)
      adjusts the ranking. Use for ranking/prioritising findings, not for scanning code or hosts.
    intents: [VULNERABILITY_TRIAGE_GENERAL]
    params:
      query:
        required:
          - name: cve_id
            type: string
            intents: ["*"]
            description: >-
              CVE identifier such as CVE-2021-44228 (format CVE-YYYY-NNNN, 4 to 19 digits after the year).
              Several identifiers may be given separated by commas to rank them against each other.
        optional:
          - name: question
            type: string
            intents: ["*"]
            description: "The user's original question, verbatim. Any CVE identifiers in it are also triaged, and phrases such as internet-facing or production are used as asset context."
          - name: criticality
            type: string
            intents: ["*"]
            description: "Business criticality of the affected asset. Allowed values: critical, high, medium, low."
          - name: internet_exposed
            type: boolean
            intents: ["*"]
            description: "true if the affected asset is reachable from the internet, false if internal only."
          - name: environment
            type: string
            intents: ["*"]
            description: "Environment of the affected asset. Allowed values: production, staging, development, test."

  - path: /launch-review
    external_path: /launch-review
    method: GET
    description: >-
      Security review (and, for a repository or website, a pre-launch legal review) of pasted source code or a unified diff,
      package versions such as lodash@4.17.15 or django==3.2.0, a PUBLIC GitHub repository, and/or a public website. Returns verdict
      (Secure, Needs changes or Insecure), vulnerability_count, issues (CVE ids and weakness categories, most serious
      first), a ranked fix-first list that merges vulnerable dependencies (scored with CISA KEV, EPSS and NVD), leaked
      secrets, risky code patterns and site security headers with legal compliance gaps, and a cited legal checklist
      for the countries given (EU, India, US) and sector (SaaS or e-commerce). Findings are evidence-based
      ("not detected"), not legal advice. Use for reviewing code or a site before go-live, not for single CVE lookups.
    intents: [SECURITY_REVIEW_GENERAL]
    params:
      query:
        required:
          - name: target
            type: string
            intents: ["*"]
            description: >-
              What to review, verbatim: pasted code or a unified diff, package versions (lodash@4.17.15, django==3.2.0, "lodash 4.17.15 on npm"),
              a public GitHub repository (github.com/owner/repo) and/or a website URL. For a repository or website, countries and sector may be
              added in the same text, e.g. "github.com/acme/shop eu india ecommerce".
        optional:
          - name: country
            type: string
            intents: ["*"]
            description: "Countries or regions the product will operate in, comma separated: eu, india, us."
          - name: sector
            type: string
            intents: ["*"]
            description: "Business sector. Allowed values: saas, ecommerce."

  - path: /crypto-price
    external_path: /crypto-price
    method: GET
    description: >-
      Current price of a cryptocurrency in US dollars. Returns price_usd, the mean of the Coinbase and Kraken USD spot tickers when they
      agree within 2 percent (otherwise null with status conflicting), with both quotes listed. Use for "what is the price of Bitcoin
      in USD". Not for market cap, volume or history.
    intents: [CRYPTO_PRICE_USD]
    params:
      query:
        required:
          - name: symbol
            type: string
            intents: ["*"]
            description: "Asset ticker or name, for example BTC, ETH, SOL, XRP, DOGE, or Bitcoin."
        optional:
          - name: question
            type: string
            intents: ["*"]
            description: "The user's original question, verbatim; the asset is read from it when symbol is absent."

  - path: /weather-temperature
    external_path: /weather-temperature
    method: GET
    description: >-
      Current air temperature at a named place anywhere in the world (Open-Meteo). Returns temperature_c in degrees Celsius plus
      Fahrenheit, the resolved place and the observation time. Use for "what is the temperature in London right now". Not a forecast.
    intents: [WEATHER_CHECK_TEMPERATURE]
    params:
      query:
        required:
          - name: location
            type: string
            intents: ["*"]
            description: >-
              City name, optionally with a state or country to disambiguate (London; Miami, Florida; Springfield, IL; Paris, France),
              or latitude,longitude (51.5,-0.12).
        optional:
          - name: question
            type: string
            intents: ["*"]
            description: "The user's original question, verbatim; the place is read from it when location is absent."

  - path: /gas-price
    external_path: /gas-price
    method: GET
    description: >-
      Current transaction gas price on a named blockchain network from two independent public RPC operators. Returns gas_price_gwei,
      the chain, the block number, the EIP-1559 base fee and the native cost of a 21,000-gas transfer. Networks: Ethereum, Base,
      Arbitrum, Polygon, Optimism. Not the price of the chain's token.
    intents: [GAS_PRICE_GENERAL]
    params:
      query:
        required:
          - name: chain
            type: string
            intents: ["*"]
            description: "Network: eth (Ethereum), base, arbitrum, polygon or optimism."
        optional:
          - name: question
            type: string
            intents: ["*"]
            description: "The user's original question, verbatim; the network is read from it when chain is absent."

  - path: /tx-lookup
    external_path: /tx-lookup
    method: GET
    description: >-
      Details and status of an on-chain transaction from two independent public RPC operators. Returns status (confirmed, reverted,
      pending or not_found), from, to, block_number, block_hash, value_eth, gas_used and confirmations. If chain is omitted the
      transaction is searched on Ethereum, Base, Arbitrum, Polygon and Optimism. An RPC outage is reported as unavailable, never as
      not_found. Requires a real 0x transaction hash.
    intents: [ONCHAIN_TX_LOOKUP_GENERAL]
    params:
      query:
        required:
          - name: tx_hash
            type: string
            intents: ["*"]
            description: "Transaction hash: 0x followed by 64 hexadecimal characters."
        optional:
          - name: chain
            type: string
            intents: ["*"]
            description: "Network: eth, base, arbitrum, polygon or optimism. Searched across all of them when omitted."

  - path: /dns-lookup
    external_path: /dns-lookup
    method: GET
    description: >-
      Whether a DNS name has records of a given type, as agreed by Google Public DNS and Cloudflare (DNS-over-HTTPS). Returns
      has_record (true, false, or null when the resolvers disagree or fail), the records, TTL and whether the name exists (NXDOMAIN).
      Record types: A, AAAA, CNAME, MX, NS, TXT, SOA, CAA, SRV, PTR.
    intents: [DNS_RECORD_LOOKUP_GENERAL]
    params:
      query:
        required:
          - name: name
            type: string
            intents: ["*"]
            description: "Public DNS name, for example example.com or www.github.com."
          - name: record_type
            type: string
            intents: ["*"]
            description: "Record type: A, AAAA, CNAME, MX, NS, TXT, SOA, CAA, SRV or PTR."

  - path: /sanctions-screening
    external_path: /sanctions-screening
    method: GET
    description: >-
      Screen a person, company or digital-currency address against the OFAC SDN and UN Security Council consolidated sanctions lists,
      including aliases and near-matches on spelling. Returns matched (true, false, or null when the lists could not be loaded),
      verdict (match, potential_match, no_match), scored matches with list, program and reference, and the lists actually checked.
      The EU and UK lists are not checked and the answer says so. A hit is a lead for human review, not a legal determination.
    intents: [SANCTIONS_SCREENING_MATCH_GENERAL]
    params:
      query:
        required:
          - name: name
            type: string
            intents: ["*"]
            description: "Person, company or wallet address to screen, optionally with context such as 'Ivan Petrov, DOB 1974, Cyprus'."
        optional:
          - name: country
            type: string
            intents: ["*"]
            description: "Nationality or country, used to refine the match."
          - name: year_of_birth
            type: string
            intents: ["*"]
            description: "Four-digit birth year for an individual; a contradicting year lowers the match score."

  - path: /corporate-registry
    external_path: /corporate-registry
    method: GET
    description: >-
      Official legal-entity record from GLEIF, the global Legal Entity Identifier register: legal name, registration number, active
      status, legal address, jurisdiction, incorporation date and LEI. Directors and beneficial owners are not held by GLEIF and are
      reported as not available. Entities without an LEI are reported as not found in GLEIF, which is not proof they do not exist.
    intents: [CORPORATE_REGISTRY_LOOKUP_GENERAL]
    params:
      query:
        required:
          - name: company
            type: string
            intents: ["*"]
            description: "Legal name of the company, or its 20-character LEI."
        optional:
          - name: jurisdiction
            type: string
            intents: ["*"]
            description: "Country of the entity, name or ISO code (United Kingdom, GB, US, India), to disambiguate similar names."
          - name: registration_id
            type: string
            intents: ["*"]
            description: "National company registration number, if known."

  - path: /vendor-verify
    external_path: /vendor-verify
    method: GET
    description: >-
      Combined supplier check from public evidence: EU VAT registration (VIES), legal-entity register status (GLEIF) and sanctions
      screening (OFAC SDN, UN). Returns verdict (verified, needs_review or failed), valid (VAT validity), the registered name and
      address, every check with its status and the checks that could not be made (bank account ownership, certifications). Not legal advice.
    intents: [VENDOR_VERIFY_GENERAL]
    params:
      query:
        required:
          - name: vendor
            type: string
            intents: ["*"]
            description: "Legal name of the supplier."
        optional:
          - name: vat_number
            type: string
            intents: ["*"]
            description: "EU VAT number with country prefix, for example DE123456789."

  - path: /filing-monitor
    external_path: /filing-monitor
    method: GET
    description: >-
      SEC EDGAR filings for an issuer (company name, ticker or CIK): whether a form such as 10-K, 10-Q or 8-K was filed, how many
      in a period, and the latest filing's date, acceptance time, report period, 8-K item meanings and URL. The filing text is not
      read. Covers US-listed and SEC-registered issuers only.
    intents: [REGULATORY_FILING_MONITOR_GENERAL]
    params:
      query:
        required:
          - name: entity
            type: string
            intents: ["*"]
            description: "Issuer name, ticker (TSLA) or CIK."
        optional:
          - name: form
            type: string
            intents: ["*"]
            description: "Form type, for example 10-K, 10-Q, 8-K, S-1, DEF 14A."
          - name: period
            type: string
            intents: ["*"]
            description: "Year (2026), quarter (Q1 2026), date range (2026-01-01 to 2026-06-30), 'since 2026-03-01' or 'last 90 days'."

  - path: /contract-audit
    external_path: /contract-audit
    method: GET
    description: >-
      Extract the obligations in contract text: who must do what, deliverables, milestones, payment terms and amounts, and explicit or
      relative deadlines, each classified as upcoming, past_due_date, undated or completed per the text. Rule-based, no language model.
      Reports dates that have passed; it cannot know whether an obligation was actually performed. Not legal advice.
    intents: [CONTRACT_OBLIGATION_AUDIT_GENERAL]
    params:
      query:
        required:
          - name: contract
            type: string
            intents: ["*"]
            description: "The contract text (first 20000 characters are analysed)."
        optional:
          - name: as_of
            type: string
            intents: ["*"]
            description: "Date to judge deadlines against, YYYY-MM-DD; today when omitted."

  - path: /sentiment
    external_path: /sentiment
    method: GET
    description: >-
      Sentiment and emotional tone of English text using the VADER lexicon and rules (no language model, no external call). Returns
      sentiment (positive, negative, neutral or mixed), a compound score from -1 to +1, the words that drove it, and a lower
      confidence when the text does not look English.
    intents: [SENTIMENT_ANALYSIS_GENERAL]
    params:
      query:
        required:
          - name: text
            type: string
            intents: ["*"]
            description: "The text to analyse, for example a review or message."

  - path: /translate
    external_path: /translate
    method: GET
    description: >-
      Translate text into a target language (MyMemory machine translation; the text is sent to that third-party service). The
      source language is detected when not given. Returns the translation as the answer, the detected source language and a quality
      score. Up to 1500 characters.
    intents: [LANGUAGE_TRANSLATION_GENERAL]
    params:
      query:
        required:
          - name: text
            type: string
            intents: ["*"]
            description: "Text to translate."
          - name: target_language
            type: string
            intents: ["*"]
            description: "Target language name or code, for example French or fr."
        optional:
          - name: source_language
            type: string
            intents: ["*"]
            description: "Source language name or code; detected when omitted."

  - path: /text-classification
    external_path: /text-classification
    method: GET
    description: >-
      Assign text to one of the labels you supply (for example billing, technical, account) using keyword and label-overlap scoring. Returns category, a one-sentence reason naming the words that decided it, and confidence. Returns category null when no label is supported by the text, instead of guessing. No language model. Not for tone (use sentiment).
    intents: [TEXT_CLASSIFICATION_GENERAL]
    params:
      query:
        required:
          - name: text
            type: string
            intents: ["*"]
            description: "The text to classify, verbatim."
          - name: categories
            type: string
            intents: ["*"]
            description: "Candidate labels, comma separated, for example billing, technical, account."
        optional:
          - name: question
            type: string
            intents: ["*"]
            description: "The user's original question, verbatim; the text and labels are read from it when absent."

  - path: /keyword-extraction
    external_path: /keyword-extraction
    method: GET
    description: >-
      Extract the most representative keywords and key phrases from body text with RAKE phrase scoring. Returns keywords (strings, best first), scores and occurrence counts. Deterministic, no language model, no external call.
    intents: [KEYWORD_EXTRACTION_GENERAL]
    params:
      query:
        required:
          - name: text
            type: string
            intents: ["*"]
            description: "The body text to extract keywords from."
        optional:
          - name: top_n
            type: string
            intents: ["*"]
            description: "How many keywords to return, 1 to 30; default 10."

  - path: /semantic-similarity
    external_path: /semantic-similarity
    method: GET
    description: >-
      Cosine similarity (0 to 1) between two texts over stemmed words and bigrams with a small synonym list, plus a verdict (near_identical, highly_similar, related, different) and the shared terms. Lexical, not a neural embedding: paraphrases with different vocabulary score lower.
    intents: [SEMANTIC_SIMILARITY_GENERAL]
    params:
      query:
        required:
          - name: text_a
            type: string
            intents: ["*"]
            description: "First text or sentence."
          - name: text_b
            type: string
            intents: ["*"]
            description: "Second text or sentence."

  - path: /entity-extraction
    external_path: /entity-extraction
    method: GET
    description: >-
      Extract entities with character offsets: dates, money, percentages, emails, URLs, phone numbers, IP addresses, CVE ids, Ethereum addresses and transaction hashes, @handles, hashtags, and heuristic person, organisation and location names. Rule-based, no language model; person and organisation labels are heuristic.
    intents: [ENTITY_EXTRACTION_GENERAL]
    params:
      query:
        required:
          - name: text
            type: string
            intents: ["*"]
            description: "The text to extract entities from."

  - path: /text-summarization
    external_path: /text-summarization
    method: GET
    description: >-
      Extractive summary of a long text: the highest-scoring original sentences in their original order, nothing added or reworded, with the compression ratio. Deterministic, no language model, so it cannot hallucinate.
    intents: [TEXT_SUMMARIZATION_GENERAL]
    params:
      query:
        required:
          - name: text
            type: string
            intents: ["*"]
            description: "The document to summarise, verbatim."
        optional:
          - name: sentences
            type: string
            intents: ["*"]
            description: "Number of sentences wanted, 1 to 8; chosen from the length when absent."

  - path: /llm-evaluation
    external_path: /llm-evaluation
    method: GET
    description: >-
      Structural quality check of a model's output against the task it was given: task-term coverage, repetition loops, truncation, unfilled placeholders, refusal language, and whether JSON, word-limit and list-count instructions were met. Returns rating (poor, fair, good, excellent), score 0 to 1, strengths and errors. It cannot verify factual accuracy or hallucination without a reference, and says so.
    intents: [LLM_OUTPUT_EVALUATION_GENERAL]
    params:
      query:
        required:
          - name: task
            type: string
            intents: ["*"]
            description: "The prompt or task the model was given."
          - name: output
            type: string
            intents: ["*"]
            description: "The model output to evaluate, verbatim."

  - path: /ai-text-detection
    external_path: /ai-text-detection
    method: GET
    description: >-
      Stylometric estimate of whether supplied text (at least 40 words) was written by an AI: sentence-length variation, stock phrases, contractions, voice. Returns verdict (likely_ai, uncertain, likely_human), ai_likelihood 0 to 1 and the cues. A heuristic, not proof of authorship; confidence is capped accordingly.
    intents: [AI_TEXT_DETECTION_GENERAL]
    params:
      query:
        required:
          - name: text
            type: string
            intents: ["*"]
            description: "The text to assess, verbatim."




  - path: /wallet-balance
    external_path: /wallet-balance
    method: GET
    description: >-
      Current native or ERC-20 balance of one 0x address on Ethereum, Base, Arbitrum, Polygon or Optimism, read from two independent public RPC operators that must agree. Tokens: USDC, USDT, DAI, WETH, WBTC or a 0x contract. ENS names are not resolved. An RPC outage is reported as unavailable, never as zero.
    intents: [WALLET_BALANCE_CHECK_GENERAL]
    params:
      query:
        required:
          - name: address
            type: string
            intents: ["*"]
            description: "The 0x wallet address."
        optional:
          - name: chain
            type: string
            intents: ["*"]
            description: "Network: eth, base, arbitrum, polygon or optimism; default eth."
          - name: token
            type: string
            intents: ["*"]
            description: "Token symbol or 0x contract; the chain's native coin when omitted."

  - path: /token-supply
    external_path: /token-supply
    method: GET
    description: >-
      ERC-20 totalSupply() of a token on Ethereum, Base, Arbitrum, Polygon or Optimism, read from two independent public RPC operators that must agree within 0.1 percent. Returns total_supply in whole tokens, the raw integer, decimals and symbol. Total supply is minted minus burned, not circulating supply.
    intents: [TOKEN_TOTAL_SUPPLY_VERIFY_GENERAL]
    params:
      query:
        required:
          - name: token
            type: string
            intents: ["*"]
            description: "Token symbol (USDC, USDT, DAI, WETH, WBTC) or 0x contract address."
        optional:
          - name: chain
            type: string
            intents: ["*"]
            description: "Network: eth, base, arbitrum, polygon or optimism; default eth."

  - path: /tvl
    external_path: /tvl
    method: GET
    description: >-
      Total value locked in a DeFi protocol (aave, uniswap, lido, aave-v3), in a chain (Base, Ethereum), or the DEX-pool liquidity of a token contract on a chain, from DefiLlama. Returns tvl_usd, chain_tvl_usd when a chain is named, and the as-of time. Unknown names are reported as not found.
    intents: [TVL_LOOKUP_GENERAL]
    params:
      query:
        required:
          - name: protocol
            type: string
            intents: ["*"]
            description: "Protocol, chain, or token contract (0x...) to look up."
        optional:
          - name: chain
            type: string
            intents: ["*"]
            description: "Chain to scope a token contract or report chain TVL, for example base."

  - path: /yield-rate
    external_path: /yield-rate
    method: GET
    description: >-
      Current APY of a DeFi pool or lending market from DefiLlama: the largest pool matching project, symbol and chain. Returns supply_apy in percent per year with its base and reward parts, the pool TVL and the number of pools it chose from.
    intents: [CRYPTO_YIELD_RATE_GENERAL]
    params:
      query:
        required:
          - name: project
            type: string
            intents: ["*"]
            description: "Protocol, for example aave-v3, compound-v3, lido."
          - name: symbol
            type: string
            intents: ["*"]
            description: "Asset symbol, for example USDC, ETH, STETH."
        optional:
          - name: chain
            type: string
            intents: ["*"]
            description: "Chain, for example ethereum or base."

  - path: /liquidity-depth
    external_path: /liquidity-depth
    method: GET
    description: >-
      Liquidity of a DEX trading pair on a chain from DefiLlama pool TVL (for example WETH/USDC on Base), with a constant-product slippage estimate when the question states a trade size in dollars. Returns liquidity_usd, the chosen pool and 24-hour volume. Pool TVL, not an order-book depth snapshot.
    intents: [LIQUIDITY_DEPTH_VERIFY_GENERAL]
    params:
      query:
        required:
          - name: pool
            type: string
            intents: ["*"]
            description: "Trading pair such as WETH/USDC, or a DefiLlama pool id."
        optional:
          - name: chain
            type: string
            intents: ["*"]
            description: "Chain, for example base."
          - name: question
            type: string
            intents: ["*"]
            description: "The user's original question, verbatim; a dollar trade size in it gives a slippage estimate."

  - path: /contract-source-audit
    external_path: /contract-source-audit
    method: GET
    description: >-
      Static pattern audit of pasted Solidity source: reentrancy, tx.origin authorisation, selfdestruct, delegatecall, unchecked low-level calls, missing access control on privileged functions, floating pragma, pre-0.8 overflow, weak randomness, timestamp dependence, with SWC ids, line numbers and fixes. Verdict is critical_issues_found, issues_found or no_issues_detected, never 'secure'. Bytecode and bare addresses are not audited.
    intents: [SMART_CONTRACT_AUDIT_GENERAL]
    params:
      query:
        required:
          - name: contract
            type: string
            intents: ["*"]
            description: "Solidity source code."

  - path: /content-moderation
    external_path: /content-moderation
    method: GET
    description: >-
      Moderate a piece of content with pattern rules: violent threats, hate, illegal-goods offers, self-harm, harassment, sexual content, profanity, spam and scams, and personal data (emails, phone numbers, SSNs, card numbers). Returns verdict (safe, review, unsafe), flagged, categories and the reason with matched text. Explicit patterns only; coded abuse can be missed.
    intents: [CONTENT_MODERATION_GENERAL]
    params:
      query:
        required:
          - name: text
            type: string
            intents: ["*"]
            description: "The content to moderate, verbatim."

  - path: /plagiarism-check
    external_path: /plagiarism-check
    method: GET
    description: >-
      Compare a text against a source text you supply: percentage of words copied verbatim (5-word shingles), the matched passages, and a possible-paraphrase flag from vocabulary similarity. Compares two supplied texts only; it does not search the web or a corpus and cannot say a text is original.
    intents: [PLAGIARISM_DETECTION_GENERAL]
    params:
      query:
        required:
          - name: text
            type: string
            intents: ["*"]
            description: "The text to check."
          - name: source
            type: string
            intents: ["*"]
            description: "The reference text to compare it against."

  - path: /email-security
    external_path: /email-security
    method: GET
    description: >-
      Mail authentication of a domain from two DNS-over-HTTPS resolvers: SPF (policy, lookup count, duplicates), DMARC (policy, reporting) and DKIM at common selectors, with a grade A to F. lookup_ok is true when the requested record exists and is valid, false when it is missing or invalid, null when DNS failed. Does not analyse message headers or attachments.
    intents: [EMAIL_SECURITY_GENERAL]
    params:
      query:
        required:
          - name: domain
            type: string
            intents: ["*"]
            description: "Domain or email address, for example example.com."
        optional:
          - name: record_type
            type: string
            intents: ["*"]
            description: "SPF, DKIM, DMARC or MX; SPF and DMARC together when omitted."
          - name: selector
            type: string
            intents: ["*"]
            description: "DKIM selector to check instead of the common ones."

  - path: /transaction-risk
    external_path: /transaction-risk
    method: GET
    description: >-
      Rule-based risk score for authorising a payment from the context you describe: amount, merchant category, attempt velocity, chargeback history, billing or shipping mismatch, VPN, new device or account, failed CVV or AVS, and mitigating signals such as 3-D Secure. Returns risk_level (low, medium, high, critical), risk_score 0 to 100, the signals and a suggested action. A scorecard, not a chargeback probability model.
    intents: [TRANSACTION_RISK_GENERAL]
    params:
      query:
        required:
          - name: transaction
            type: string
            intents: ["*"]
            description: "Plain-language description of the payment and its context."


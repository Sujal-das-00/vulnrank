intent_mapping:
  VULNERABILITY_TRIAGE_GENERAL:
    endpoint: /vuln-triage
    input:
      cve_id: { from: cve_id, how: "Canonical CVE id(s) in upper case, comma separated when several." }
    output:
      cvss_base_score: { path: cvss_base_score }
  SECURITY_REVIEW_GENERAL:
    endpoint: /launch-review
    input:
      target: { from: target, how: "What to review, verbatim: pasted code or diff, package versions, a GitHub repository or a website, including any country or sector words in the request." }
    output:
      verdict: { path: verdict }
      vulnerability_count: { path: vulnerability_count }
      issues: { path: "issues[]" }
      summary: { path: summary }

  CRYPTO_PRICE_USD:
    endpoint: /crypto-price
    input:
      symbol: { from: symbol, how: "Asset ticker such as BTC, ETH or SOL, upper case." }
    output:
      price_usd: { path: price_usd, unit: "US dollars" }
  WEATHER_CHECK_TEMPERATURE:
    endpoint: /weather-temperature
    input:
      location: { from: location, how: "City name with optional state or country, or latitude,longitude." }
    output:
      temperature_c: { path: temperature_c, unit: "degrees Celsius" }
  GAS_PRICE_GENERAL:
    endpoint: /gas-price
    input:
      chain: { from: chain, how: "Network name: eth, base, arbitrum, polygon or optimism." }
    output:
      chain: { path: chain }
      gas_price_gwei: { path: gas_price_gwei, unit: gwei }
      as_of: { path: as_of }
  ONCHAIN_TX_LOOKUP_GENERAL:
    endpoint: /tx-lookup
    input:
      tx_hash: { from: tx_hash, how: "0x-prefixed 64 hex character transaction hash." }
      chain: { from: chain, how: "Network name; omitted when the request does not name one." }
    output:
      tx_hash: { path: tx_hash }
      status: { path: status }
      from: { path: from }
      to: { path: to }
      block_number: { path: block_number, unit: "block height" }
      value_eth: { path: value_eth, unit: "whole native units" }
  DNS_RECORD_LOOKUP_GENERAL:
    endpoint: /dns-lookup
    input:
      name: { from: name, how: "Public DNS name." }
      record_type: { from: record_type, how: "A, AAAA, CNAME, MX, NS, TXT, SOA, CAA, SRV or PTR." }
    output:
      has_record: { path: has_record }

  SANCTIONS_SCREENING_MATCH_GENERAL:
    endpoint: /sanctions-screening
    input:
      name: { from: name, how: "Person, company or wallet address, with any DOB or country context in the same text." }
    output:
      matched: { path: matched }
      match_count: { path: match_count }
      matches: { path: "matches[]" }
      highest_score: { path: highest_score }
  CORPORATE_REGISTRY_LOOKUP_GENERAL:
    endpoint: /corporate-registry
    input:
      company: { from: company, how: "Company legal name or LEI." }
      jurisdiction: { from: jurisdiction, how: "Country of the entity when stated." }
    output:
      legal_name: { path: legal_name }
      registration_id: { path: registration_id }
      active: { path: active }
      jurisdiction: { path: jurisdiction }
      registered_address: { path: registered_address }
      incorporated: { path: incorporated }
  VENDOR_VERIFY_GENERAL:
    endpoint: /vendor-verify
    input:
      vendor: { from: vendor, how: "Supplier legal name." }
      vat_number: { from: vat_number, how: "EU VAT number with country prefix, when given." }
    output:
      vendor: { path: vendor }
      vat_number: { path: vat_number }
      valid: { path: valid }
      registered_name: { path: registered_name }
      registered_address: { path: registered_address }
      verdict: { path: verdict }
  REGULATORY_FILING_MONITOR_GENERAL:
    endpoint: /filing-monitor
    input:
      entity: { from: entity, how: "Issuer name, ticker or CIK." }
      period: { from: period, how: "Period or date range when stated." }
    output:
      entity: { path: entity }
      filing_count: { path: filing_count, unit: filings }
      filings: { path: "filings[]" }
      urls: { path: "urls[]" }
  CONTRACT_OBLIGATION_AUDIT_GENERAL:
    endpoint: /contract-audit
    input:
      contract: { from: contract, how: "The contract text, verbatim." }
    output:
      verdict: { path: verdict }
      obligations: { path: "obligations[]" }
      clauses: { path: "clauses[]" }
      summary: { path: summary }
  SENTIMENT_ANALYSIS_GENERAL:
    endpoint: /sentiment
    input:
      text: { from: text, how: "The text to analyse, verbatim." }
    output:
      sentiment: { path: sentiment }
      score: { path: score }
  LANGUAGE_TRANSLATION_GENERAL:
    endpoint: /translate
    input:
      text: { from: text, how: "The text to translate, verbatim." }
      target_language: { from: target_language, how: "Target language name or code." }
    output:
      translation: { path: translation }
      target_language: { path: target_language }
      source_language: { path: source_language }

  TEXT_CLASSIFICATION_GENERAL:
    endpoint: /text-classification
    input:
      text: { from: text, how: "The text to classify, verbatim." }
      categories: { from: categories, how: "Candidate labels, comma separated, for example billing, technical, account." }
    output:
      category: { path: "category" }
      reason: { path: "reason" }
      confidence: { path: "confidence" }
  KEYWORD_EXTRACTION_GENERAL:
    endpoint: /keyword-extraction
    input:
      text: { from: text, how: "The body text to extract keywords from." }
      top_n: { from: top_n, how: "How many keywords to return, 1 to 30; default 10." }
    output:
      keywords: { path: "keywords[]" }
      keyword_count: { path: "keyword_count" }
  SEMANTIC_SIMILARITY_GENERAL:
    endpoint: /semantic-similarity
    input:
      text_a: { from: text_a, how: "First text or sentence." }
      text_b: { from: text_b, how: "Second text or sentence." }
    output:
      similarity: { path: "similarity" }
      verdict: { path: "verdict" }
      shared_terms: { path: "shared_terms[]" }
  ENTITY_EXTRACTION_GENERAL:
    endpoint: /entity-extraction
    input:
      text: { from: text, how: "The text to extract entities from." }
    output:
      entities: { path: "entities[]" }
      entity_count: { path: "entity_count" }
  TEXT_SUMMARIZATION_GENERAL:
    endpoint: /text-summarization
    input:
      text: { from: text, how: "The document to summarise, verbatim." }
      sentences: { from: sentences, how: "Number of sentences wanted, 1 to 8; chosen from the length when absent." }
    output:
      summary: { path: "summary" }
      compression: { path: "compression" }
  LLM_OUTPUT_EVALUATION_GENERAL:
    endpoint: /llm-evaluation
    input:
      task: { from: task, how: "The prompt or task the model was given." }
      output: { from: output, how: "The model output to evaluate, verbatim." }
    output:
      rating: { path: "rating" }
      score: { path: "score" }
      strengths: { path: "strengths[]" }
      errors: { path: "errors[]" }
  AI_TEXT_DETECTION_GENERAL:
    endpoint: /ai-text-detection
    input:
      text: { from: text, how: "The text to assess, verbatim." }
    output:
      verdict: { path: "verdict" }
      ai_likelihood: { path: "ai_likelihood" }
      cues: { path: "cues[]" }
  WALLET_BALANCE_CHECK_GENERAL:
    endpoint: /wallet-balance
    input:
      address: { from: address, how: "The 0x wallet address." }
      chain: { from: chain, how: "Network: eth, base, arbitrum, polygon or optimism; default eth." }
      token: { from: token, how: "Token symbol or 0x contract; the chain's native coin when omitted." }
    output:
      address: { path: "address" }
      chain: { path: "chain" }
      balance: { path: "balance", unit: "whole tokens" }
      token_symbol: { path: "token_symbol" }
      as_of: { path: "as_of" }
  TOKEN_TOTAL_SUPPLY_VERIFY_GENERAL:
    endpoint: /token-supply
    input:
      token: { from: token, how: "Token symbol (USDC, USDT, DAI, WETH, WBTC) or 0x contract address." }
      chain: { from: chain, how: "Network: eth, base, arbitrum, polygon or optimism; default eth." }
    output:
      total_supply: { path: "total_supply", unit: "whole tokens" }
      token_symbol: { path: "token_symbol" }
      token_address: { path: "token_address" }
      chain: { path: "chain" }
  TVL_LOOKUP_GENERAL:
    endpoint: /tvl
    input:
      protocol: { from: protocol, how: "Protocol, chain, or token contract (0x...) to look up." }
      chain: { from: chain, how: "Chain to scope a token contract or report chain TVL, for example base." }
    output:
      protocol_or_chain: { path: "protocol_or_chain" }
      tvl_usd: { path: "tvl_usd", unit: "US dollars" }
      chain_tvl_usd: { path: "chain_tvl_usd", unit: "US dollars" }
      as_of: { path: "as_of" }
  CRYPTO_YIELD_RATE_GENERAL:
    endpoint: /yield-rate
    input:
      project: { from: project, how: "Protocol, for example aave-v3, compound-v3, lido." }
      symbol: { from: symbol, how: "Asset symbol, for example USDC, ETH, STETH." }
      chain: { from: chain, how: "Chain, for example ethereum or base." }
    output:
      supply_apy: { path: "supply_apy", unit: "percent per year" }
      project: { path: "project" }
      symbol: { path: "symbol" }
      chain: { path: "chain" }
      tvl_usd: { path: "tvl_usd", unit: "US dollars" }
  LIQUIDITY_DEPTH_VERIFY_GENERAL:
    endpoint: /liquidity-depth
    input:
      pool: { from: pool, how: "Trading pair such as WETH/USDC, or a DefiLlama pool id." }
      chain: { from: chain, how: "Chain, for example base." }
    output:
      liquidity_usd: { path: "liquidity_usd", unit: "US dollars" }
      pool: { path: "pool" }
      project: { path: "project" }
      chain: { path: "chain" }
  SMART_CONTRACT_AUDIT_GENERAL:
    endpoint: /contract-source-audit
    input:
      contract: { from: contract, how: "Solidity source code." }
    output:
      verdict: { path: "verdict" }
      findings: { path: "findings[]" }
      finding_count: { path: "finding_count" }
      summary: { path: "summary" }
  CONTENT_MODERATION_GENERAL:
    endpoint: /content-moderation
    input:
      text: { from: text, how: "The content to moderate, verbatim." }
    output:
      verdict: { path: "verdict" }
      flagged: { path: "flagged" }
      categories: { path: "categories[]" }
      reason: { path: "reason" }
  PLAGIARISM_DETECTION_GENERAL:
    endpoint: /plagiarism-check
    input:
      text: { from: text, how: "The text to check." }
      source: { from: source, how: "The reference text to compare it against." }
    output:
      similarity_pct: { path: "similarity_pct" }
      plagiarized: { path: "plagiarized" }
      verdict: { path: "verdict" }
      matched_passages: { path: "matched_passages[]" }
  EMAIL_SECURITY_GENERAL:
    endpoint: /email-security
    input:
      domain: { from: domain, how: "Domain or email address, for example example.com." }
      record_type: { from: record_type, how: "SPF, DKIM, DMARC or MX; SPF and DMARC together when omitted." }
      selector: { from: selector, how: "DKIM selector to check instead of the common ones." }
    output:
      lookup_ok: { path: "lookup_ok" }
      grade: { path: "grade" }
      spf: { path: "spf" }
      dmarc: { path: "dmarc" }
      dkim: { path: "dkim" }
  TRANSACTION_RISK_GENERAL:
    endpoint: /transaction-risk
    input:
      transaction: { from: transaction, how: "Plain-language description of the payment and its context." }
    output:
      risk_level: { path: "risk_level" }
      risk_score: { path: "risk_score" }
      signals: { path: "signals[]" }
      summary: { path: "summary" }

semantics:
  signal_mapping:
    label_field: priority
    confidence_field: confidence
    reason_field: summary
  supported_intents:
    - VULNERABILITY_TRIAGE_GENERAL
    - SECURITY_REVIEW_GENERAL
    - CRYPTO_PRICE_USD
    - WEATHER_CHECK_TEMPERATURE
    - GAS_PRICE_GENERAL
    - ONCHAIN_TX_LOOKUP_GENERAL
    - DNS_RECORD_LOOKUP_GENERAL
    - SANCTIONS_SCREENING_MATCH_GENERAL
    - CORPORATE_REGISTRY_LOOKUP_GENERAL
    - VENDOR_VERIFY_GENERAL
    - REGULATORY_FILING_MONITOR_GENERAL
    - CONTRACT_OBLIGATION_AUDIT_GENERAL
    - SENTIMENT_ANALYSIS_GENERAL
    - LANGUAGE_TRANSLATION_GENERAL
    - TEXT_CLASSIFICATION_GENERAL
    - KEYWORD_EXTRACTION_GENERAL
    - SEMANTIC_SIMILARITY_GENERAL
    - ENTITY_EXTRACTION_GENERAL
    - TEXT_SUMMARIZATION_GENERAL
    - LLM_OUTPUT_EVALUATION_GENERAL
    - AI_TEXT_DETECTION_GENERAL
    - WALLET_BALANCE_CHECK_GENERAL
    - TOKEN_TOTAL_SUPPLY_VERIFY_GENERAL
    - TVL_LOOKUP_GENERAL
    - CRYPTO_YIELD_RATE_GENERAL
    - LIQUIDITY_DEPTH_VERIFY_GENERAL
    - SMART_CONTRACT_AUDIT_GENERAL
    - CONTENT_MODERATION_GENERAL
    - PLAGIARISM_DETECTION_GENERAL
    - EMAIL_SECURITY_GENERAL
    - TRANSACTION_RISK_GENERAL

limitations:
  - code: MAX_PARAM_LENGTH
    message: "cve_id accepts at most 100 CVE identifiers per request."
    param: cve_id
    property: length
    value_num: 2500
    operator: lte

errors:
  message_path: message

rate_limit_per_sec: 5
cache_ttl_sec: 0
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  repository: https://github.com/Sujal-das-00/vulnrank.git
